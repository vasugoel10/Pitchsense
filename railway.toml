[build]
buildCommand = "cd frontend && npm install && npm run build && cd .. && python manage.py collectstatic --noinput && python manage.py migrate"

[deploy]
startCommand = "daphne pitchsense.asgi:application --bind 0.0.0.0 --port $PORT"
healthcheckPath = "/api/csrf/"
restartPolicyType = "on-failure"
