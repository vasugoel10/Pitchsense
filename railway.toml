[build]
buildCommand = "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py test --no-input"

[deploy]
startCommand = "daphne pitchsense.asgi:application --bind 0.0.0.0 --port $PORT"
healthcheckPath = "/api/csrf/"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 5
